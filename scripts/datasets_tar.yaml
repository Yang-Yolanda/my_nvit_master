# Canonical dataset tar layout for NViT training (DATA_ROOT/dataset_tars/...).
# Maintain this file only; point all scripts via ++DATASETS_CONFIG_FILE=$NViT_ROOT/scripts/datasets_tar.yaml

MPI-INF-TRAIN-PRUNED:
    TYPE: ImageDataset
    URLS: ${DATA_ROOT}/dataset_tars/mpi-inf-train-pruned/{000000..00006}.tar
    epoch_size: 12_000
H36M-TRAIN-WMASK:
    TYPE: ImageDataset
    URLS: ${DATA_ROOT}/dataset_tars/h36m/{000000..000312}.tar
    epoch_size: 314_000 # Can be changed arbitrarily. Enables resampling. 
MPII-TRAIN-WMASK:
    TYPE: ImageDataset
    URLS: ${DATA_ROOT}/dataset_tars/mpii/{000000..000009}.tar
    epoch_size: 100_000 # Increase to ensure dataset doesn't end before epoch
COCO-TRAIN-2014-WMASK-PRUNED:
    TYPE: ImageDataset
    URLS: ${DATA_ROOT}/dataset_tars/coco/{000000..000017}.tar
    epoch_size: 18_000
AVA-TRAIN-MIDFRAMES-1FPS-WMASK:
    TYPE: ImageDataset
    URLS: ${DATA_ROOT}/dataset_tars/ava/{000000..000092}.tar
    epoch_size: 200_000
AIC-TRAIN-WMASK:
    TYPE: ImageDataset
    URLS: ${DATA_ROOT}/dataset_tars/aic/{000000..000104}.tar
    epoch_size: 200_000
COCO-TRAIN-2014-VITPOSE-REPLICATE-PRUNED12:
    TYPE: ImageDataset
    URLS: ${DATA_ROOT}/dataset_tars/coco/{000000..000034}.tar
    epoch_size: 45_000
